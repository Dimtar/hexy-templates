# The install guide. Each step's screenshot is looked up in site/guide/img/;
# until the file exists the page shows a labelled placeholder instead.
# Menu names follow HexOS as of late 2025 — update them if HexOS renames things.

title: How to install an app with a custom install script
intro: >-
  A custom install script tells HexOS exactly how to set an app up: where its files go,
  which port it uses and how much of your server it may use. It takes about two minutes.

steps:
  - title: Turn on expert mode and experimental features
    body:
      - In HexOS, open Settings, go to Preferences, then open Advanced Settings.
      - Turn on both the Expert mode and Experimental features switches. Together they unlock the
        Custom Install button on app pages.
    tip: You only need to do this once.
    screenshot: step-1-preferences.png
    alt: HexOS Settings › Preferences › Advanced Settings with the Expert mode and Experimental features switches turned on

  - title: Find your app and copy its script
    body:
      - Search for the app in the Hexy Templates library and open its page.
      - Press Copy script. The whole script is now on your clipboard.
      - Read the boxes on the right if you want to know what will happen — especially any
        yellow boxes, which mark questions you'll be asked.
    screenshot: step-2-copy.png
    alt: An app page on Hexy Templates with the Copy script button highlighted

  - title: Open the app in HexOS
    body:
      - In HexOS, go to Apps and search for the same app.
      - Open it and choose Custom Install — the button with the glasses icon, which only
        appears in expert mode.
      - Don't press the plain Install button. For apps HexOS doesn't curate yet, that takes you
        to the TrueNAS setup screen instead of using the script.
    screenshot: step-3-custom-install.png
    alt: The Audiobookshelf app in HexOS with the Custom Install button highlighted

  - title: Paste the script
    body:
      - A window titled “Install … with custom script” opens with a script editor. It may already
        contain a starter script, the app's default script, or the last script you used.
      - Click inside the editor, select everything (Ctrl+A, or Cmd+A on a Mac) and delete it.
      - Paste the script you copied (Ctrl+V, or Cmd+V on a Mac).
    warning: >-
      Empty the editor completely before pasting — including any leftover { } brackets. If anything
      is left behind, the pasted script won't be valid and the install will fail.
    tip: If the editor shows a red error, the paste was probably cut short — copy the script again.
    screenshot: step-4-paste.png
    alt: The “Install Audiobookshelf with custom script” window with the script pasted into the editor

  - title: Answer any questions, then install
    body:
      - Press Install below the script editor.
      - If the app needs details from you, a Configuration page appears — for example, Directus
        asks for an admin email and password. Fill in every field marked with a red star, then
        press Install again. Passwords for the app's internal database are created for you.
      - If the app needs a storage location you haven't set up yet, HexOS asks you to pick one.
      - Wait for the app to show as running. The first start can take a few minutes while HexOS
        downloads it.
    note: >-
      Most apps don't ask any questions — only about 1 in 4 scripts do. If no Configuration page
      appears, that's normal: there's nothing to fill in.
    screenshot: step-5-install.png
    alt: The Configuration page for Directus, asking for an admin email and password

  - title: Open your new app
    body:
      - Once the app shows as running, find its card in HexOS and click it. The app opens in a new
        browser tab.
      - Some apps ask you to create an account or finish a short setup the first time you open them.
    screenshot: step-6-open.png
    alt: The new app's card in HexOS, ready to click to open the app

faq:
  - q: What does “Draft” mean?
    a: >-
      Draft scripts are generated automatically from the app's TrueNAS settings. They follow the same
      pattern as HexOS's own scripts and pass the same checks, but nobody has installed that app on a real
      HexOS server with it yet. “Tested” scripts have been.
  - q: Where are my app's files stored?
    a: >-
      In the storage locations you chose when setting up HexOS — usually your fast drive for app data and your
      big drives for media. Each app page has a box that shows the exact folders.
  - q: The install failed. What now?
    a: >-
      Open the app's page here and press “Report a problem” with the error HexOS showed. You can also edit the
      script in the HexOS editor before installing — for example to change a port that's already taken.
  - q: Is this an official HexOS site?
    a: >-
      No. It's a community collection. HexOS's own curated scripts live at github.com/eshtek/hexos-app-catalog.
