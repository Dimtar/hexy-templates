title: DockRoute
description: DockRoute is External-DNS for plain Docker hosts. It watches running containers, reads dockroute.*
  labels and reconciles the matching DNS records and Cloudflare Tunnel routes in a pluggable provider,
  with TXT-based ownership so it never alters records it cannot prove it manages.
