title: nextrmnl
description: SSH and SFTP in the browser for the machines in your own network. A terminal with tabs, jump
  hosts and copy and paste like PuTTY, file transfer next to it, a vault per account for keys and passwords
  that only the account's password opens, host keys that are checked and remembered, accounts by invitation
  or OpenID Connect, an optional second factor, encrypted backups and a log without terminal content.
