title: Snapshot Visualizer
description: Visualise ZFS snapshots like WinDirStat. A cushion treemap, a timeline and sortable tables
  show which datasets, snapshots and periodic snapshot tasks use your space, sorted by size, age and naming
  schema. Reads data through the TrueNAS API; deleting selected snapshots from the web UI is optional.
  HTTPS and an optional password protect the web UI.
