title: Tempo AI
description: Tempo AI forecasts the French Tempo electricity tariff color (blue, white or red) two to
  four days ahead with a small local LightGBM model trained on public RTE and Open-Meteo data. It checks
  its own forecasts every day and exposes a REST API and a web page.
