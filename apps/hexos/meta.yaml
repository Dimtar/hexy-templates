title: HexOS
description: 'Everything you love, on a server you own. HexOS is a force multiplier for the TrueNAS you
  already run, not a replacement: install it here, claim the server at deck.hexos.com, and get the Command
  Deck on top of the pools, shares, users and apps you have today. Over a hundred curated apps and VMs
  that install in one tap, HexOS Anywhere to reach every app from anywhere with your network closed, Buddy
  Backup to a friend''s server, the Hardware Advisor watching your exact parts, and notifications a human
  can read. The full TrueNAS UI stays put.'
