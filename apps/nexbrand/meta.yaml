title: nexbrand
description: The corporate design of your clients in one place, on your own server. Colours with print
  values, fonts with their licence, logos, a type scale, rules and example files per client and per project,
  with every version kept on a timeline. Contrast checks by WCAG 2.2, client reviews through a link, and
  every version as CSS, Tailwind, SCSS or design tokens, over an API and MCP.
