# Daily check (around 6pm Sydney time) of the TrueNAS apps catalogue and of
# which apps HexOS curates. New apps get draft scripts, apps whose settings
# changed get regenerated or flagged, and the result is published straight away:
#
# - If every script passes validation, the changes are committed to main and
#   the site is redeployed. No pull request.
# - If validation fails, the changes go to a pull request on `catalog-sync`
#   instead, assigned to the maintainer, so nothing broken goes live.
# - If something needs a person (a hand-written script to update, or a new
#   HexOS-only app to describe), an issue is opened and assigned to them.
#
# The site is redeployed after every run, even with no changes, so HexOS-only
# pages pick up changes to HexOS's own scripts.
name: Sync TrueNAS catalogue

on:
  # 07:00 UTC is 6pm in Sydney during daylight saving (5pm in winter). GitHub
  # often starts scheduled runs hours late, so treat this as "once a day,
  # roughly evening in Sydney" rather than an exact time. There is deliberately
  # no time-of-day check: an earlier version skipped every delayed run.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare with upstream
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/sync.py --report "$RUNNER_TEMP/report.md"
      - name: Validate install scripts
        id: validate
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: python tools/validate.py

      - name: Publish changes
        if: steps.sync.outputs.changed == 'true' && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps hexos-only updates
          git commit -q -m "Sync with TrueNAS catalogue: ${{ steps.sync.outputs.summary }}" -m "$(cat "$RUNNER_TEMP/report.md")"
          git push -q origin HEAD:main

      - name: Hold changes for review (validation failed)
        if: steps.sync.outputs.changed == 'true' && steps.validate.outcome == 'failure'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog-sync
          delete-branch: true
          commit-message: "Sync with TrueNAS catalogue: ${{ steps.sync.outputs.summary }}"
          title: "TrueNAS catalogue update needs a fix: ${{ steps.sync.outputs.summary }}"
          body-path: ${{ runner.temp }}/report.md
          labels: catalog-sync
          # Assigning the PR is what makes GitHub email the maintainer about it.
          assignees: ${{ github.repository_owner }}
          add-paths: |
            apps/**
            hexos-only/**
            updates/**

      - name: Ask for help where a person is needed
        if: steps.sync.outputs.attention == 'true' && steps.validate.outcome == 'success'
        run: |
          gh issue create \
            --title "Catalogue sync needs you: $(date -u +%F)" \
            --assignee "${{ github.repository_owner }}" \
            --body-file "$RUNNER_TEMP/report.md"

      - name: Redeploy the site
        if: always()
        run: gh workflow run deploy.yml --ref main
