# Daily check (6pm Sydney time) of the TrueNAS apps catalogue. New apps get draft scripts and
# apps whose settings changed get regenerated or flagged; everything lands in a
# single pull request on the `catalog-sync` branch for a human to review.
# While that PR is open, later runs update it instead of opening another.
#
# Requires: Settings › Actions › General › "Allow GitHub Actions to create and
# approve pull requests".
name: Sync TrueNAS catalogue

on:
  # Cron is UTC-only and Sydney shifts between UTC+10 and UTC+11 for daylight
  # saving, so this fires at both 07:05 and 08:05 UTC and the gate job below
  # lets through only the run that lands at 18:xx in Sydney.
  schedule:
    - cron: "5 7,8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-sync

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Australia/Sydney date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: it is ${hour}:xx in Sydney, not 18:xx"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare with upstream
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/sync.py --report "$RUNNER_TEMP/report.md"
      - name: Validate install scripts
        if: steps.sync.outputs.changed == 'true'
        run: python tools/validate.py
      - name: Open or update pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog-sync
          delete-branch: true
          commit-message: "Sync with TrueNAS catalogue: ${{ steps.sync.outputs.summary }}"
          title: "TrueNAS catalogue update: ${{ steps.sync.outputs.summary }}"
          body-path: ${{ runner.temp }}/report.md
          labels: catalog-sync
          add-paths: apps/**
